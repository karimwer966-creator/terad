name: QSMC offline gates

# Everything that can be proven without a terminal. This is deliberately NOT a
# compile: there is no MetaEditor here, so a green run means "the mechanical
# invariants and the offline decision-logic parity hold", and F7 in MetaEditor
# still has to happen by a human. The job says so at the end, and the tools say
# it in their own output, so nobody mistakes green for "it builds".

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline-gates:
    name: static + dialect + self-test parity
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -o pipefail -e {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The checkers themselves must parse
        run: |
          mkdir -p out
          python3 -m py_compile tools/*.py

      # The tree an operator clones must be the tree the docs describe, and every
      # .set must bind to the MQL5 source it claims to configure. Both are cheap
      # (under a second) and both used to be checked by hand, one defect at a time.
      - name: Repository layout + preset binding + tool references
        run: |
          python3 tools/check_repo_layout.py --verbose 2>&1 | tee out/layout.log
          python3 tools/test_tool_reference_integrity.py 2>&1 | tee out/tool_references.log
          python3 tools/check_presets.py 2>&1 | tee out/presets.log

      - name: Mechanical pass + MQL5 dialect rules D1-D16
        run: python3 tools/static_check.py 2>&1 | tee out/static_check.log

      # Phase 2 confirmation engine: strict host build/selftest, then the
      # deterministic replay/backtest artefact contracts. These are NOT F7,
      # NOT Strategy Tester and NOT a live MT5 demo; the reports say so.
      - name: Confirmation engine native + replay/backtest contracts
        run: |
          python3 tools/confirmation_native.py 2>&1 | tee out/confirmation_native.log
          python3 tools/test_confirmation_engine.py 2>&1 | tee out/confirmation_engine.log
          python3 tools/test_confirmation_replay.py 2>&1 | tee out/confirmation_replay.log
          python3 tools/test_confirmation_backtest.py 2>&1 | tee out/confirmation_backtest.log

      # F7 on the merged build reported 42 errors whose root cause was ONE missing
      # '//' on a comment continuation line: the compiler read the prose as code,
      # then mis-parsed the whole SBP3_Clear() body as global-scope declarations.
      # Braces and parens stayed balanced, so every existing check passed - a
      # comment marker is neither. This step owns that gap, lexically.
      - name: Comment integrity (a lost // is a compile error, not a style issue)
        run: |
          python3 tools/test_comment_integrity.py 2>&1 | tee out/comment_integrity.log
          python3 tools/test_tick_performance.py 2>&1 | tee out/tick_performance.log
          python3 tools/test_runtime_diagnostics.py 2>&1 | tee out/runtime_diagnostics.log

      # One switch for all seven modules, and no per-tick object churn. Both
      # opt-in, both default false; this pins every gate and tooltip guard that
      # carries the OR so a future edit cannot silently drop one.
      - name: Master switch + redraw gate contract (AUDIT-UX1)
        run: python3 tools/test_ux1_master_switch.py 2>&1 | tee out/ux1.log

      # Four layers used to be able to disagree about direction with nothing
      - name: Arbiter decision logic vs the MQL5 self-test (1:1)
        run: python3 tools/test_arbiter.py 2>&1 | tee out/test_arbiter.log

      - name: Scanner arithmetic (fixed-point, no float drift)
        run: python3 tools/test_scanners.py 2>&1 | tee out/test_scanners.log

      - name: Quantitative statistics (EW, CUSUM, Wilson, volume profile)
        run: python3 tools/test_quant_stats.py 2>&1 | tee out/test_quant_stats.log

      - name: Causal structure-event contracts
        run: python3 tools/test_structure.py 2>&1 | tee out/test_structure.log

      - name: v6.6.25 missed-trade fixes (real MQL5 bodies on the host - not F7, not the tester)
        run: python3 tools/test_missed_trade_fixes_native.py 2>&1 | tee out/test_missed_trade_fixes_native.log

      - name: Historical ATR causality
        run: python3 tools/test_historical_atr_contract.py 2>&1 | tee out/test_historical_atr.log

      - name: Early-break warning contracts
        run: python3 tools/test_early_break.py 2>&1 | tee out/test_early_break.log

      - name: Zone scoring hard gates and factor model
        run: python3 tools/test_zone_scoring.py 2>&1 | tee out/test_zone_scoring.log

      - name: Decision dashboard clarity contract
        run: python3 tools/test_dashboard_clarity.py 2>&1 | tee out/test_dashboard_clarity.log

      - name: Execution companion contract (buffer map, switches, sizing)
        run: python3 tools/test_autotrader_contract.py 2>&1 | tee out/test_autotrader.log

      # 2026-11-09: the companion now ships ARMED ON DEMO with no .set. These two
      # prove (a) every compiled default is the production configuration and the
      # shipped .set is literally the same object, and (b) the gate-profile
      # contracts still hold with the moved risk default.
      - name: Defaults equal the shipped preset (independent .set <-> code check)
        run: python3 tools/test_defaults_match_preset.py 2>&1 | tee out/test_defaults_match_preset.log

      - name: Gate-profile contracts (thresholds, protected gates, ceilings)
        run: python3 tools/test_gate_profile.py 2>&1 | tee out/test_gate_profile.log

      # AUDIT-EX1. The contract above proves the companion sizes down; it did not
      # cover five defects in the SEND PATH itself: a failed
      # order marked the signal seen (one requote killed it), the terminal-global
      # key carried no symbol (two charts suppressed each other), RR was never
      # re-measured at the price actually paid, a failed close of the opposite
      # position still opened a second exposure, and a refused break-even modify
      # was re-sent on every tick with the failure silent.
      - name: Execution safety (retry class, symbol-scoped keys, RR at fill, BE throttle)
        run: python3 tools/test_execution_safety.py 2>&1 | tee out/test_execution_safety.log

      # v6.6.24. The EA's breaker arithmetic and the twelve RunEntryReview
      # conditions now live in a side-effect-free header, so this step COMPILES
      # and EXECUTES them natively (g++ with asan/ubsan) instead of reading the
      # source. A boundary such as "eq < floor" instead of "eq <= floor" is
      # invisible to a source contract and expensive in production.
      - name: Execution rules (day/drawdown/streak/cooldown floors + 12 review conditions)
        run: python3 tools/test_execution_rules.py 2>&1 | tee out/test_execution_rules.log

      # v6.6.25 / AUD-03 (P1). RunEntryReview() began with
      #   if(!InpPrintEntryReview) return "";
      # so switching the LOG off switched all twelve final safety checks off, and
      # the call site read the empty string as READY. A print input is not an
      # execution authorization. This step compiles the shipped
      # ReviewName/ReviewLine/RunEntryReview bodies against the shipped
      # QSMC_ExecutionRules.mqh and proves the verdict is identical with the
      # print switch ON and OFF for every one of the twelve conditions, plus
      # that a fractional spread above the cap (20.9 pts vs a 20-pt cap, the
      # int-cast truncation) and a NaN quote both fail closed. The suite existed
      # before the source was fixed and was red the whole time; it is in CI now
      # because it is green, and it is not report-only.
      - name: Entry review is a gate, not a print option (AUD-03 / P1)
        run: python3 tools/test_entry_review_gate.py 2>&1 | tee out/entry_review_gate.log

      # v6.6.24 / F-008. "piercing" and "dark cloud" demanded a close both above
      # and below the same price, so two of the four named reversal patterns
      # could never fire. The geometry is now pure and this step executes it,
      # including a sweep proving the old expressions were unsatisfiable.
      - name: Candle reversal geometry (piercing / dark cloud, proven satisfiable)
        run: python3 tools/test_candle_patterns.py 2>&1 | tee out/test_candle_patterns.log

      # v6.6.24 (audit P0-3). "CAUSALITY PASS (digests 1, comparisons 0)" and a
      # self-test printing PASS off zero scenarios are both impossible now:
      # the verdict is tri-state (zero checked items => INCONCLUSIVE) and the
      # scenario suite counts what it executed. This step compiles and executes
      # the shipped verdict helpers natively.
      - name: PMI replay audit (zero comparisons can never print PASS)
        run: python3 tools/test_pmi_replay_audit.py 2>&1 | tee out/test_pmi_replay_audit.log


      # v6.6.24. These two were pinned to snapshots that no longer exist in
      # the clone (ab46c16) and were red for drift only. They have been
      # re-pinned against the current source and are green; per the pin-drift
      # job's own rule, green suites move back up here to become gates.
      - name: One authoritative scenario state (tactical preview cannot contradict it)
        run: python3 tools/test_tactical_authority.py 2>&1 | tee out/tactical_authority.log

      - name: Documentation freshness (doc citations + countable facts vs nadir2.mq5)
        run: python3 tools/test_docs_freshness.py 2>&1 | tee out/docs_freshness.log

      # v6.6.24 (R3). The mechanical half of "is this build safe to attach to a
      # DEMO account": one version everywhere, presets bound, no order API
      # reachable from the indicator layer, one magic per QSMC executor, the
      # account-mode gate intact, the HARD ceilings, and the shipping risk
      # defaults. It is NOT a compile and NOT a backtest.
      - name: Demo preflight (version, presets, G4, magic, ceilings, defaults)
        run: python3 tools/preflight_demo.py 2>&1 | tee out/preflight_demo.log

      - name: Diagnostic bridge (the indicator's verdict -> the companion's heartbeat)
        run: python3 tools/test_diag_bridge.py 2>&1 | tee out/test_diag_bridge.log

      - name: CORE signal diagnostics source contracts (not MT5 runtime tests)
        run: python3 tools/test_core_signal_diagnostics.py 2>&1 | tee out/test_core_signal_diagnostics.log
      # AUDIT-AT1. The contract above proves the companion refuses the right
      # things; it could not see that the EA sometimes TOLD the operator a
      # different limit than it enforced: a 1.0% clamp inside CalcLots that
      # contradicted both OnInit and HardMaxRiskPercent(), a disabled daily stop
      # printed as a 10% cap, a FIXED lot size returned as tradable when the tick
      # metadata to price it was missing, and 17 refusal sites collapsed into one
      # flat `skip` that retried permanent failures and hid aged-out signals.
      # Section G is structural on purpose: these are source assertions, and a
      # source assertion on a file that does not parse is worth nothing.
      - name: Risk/limit reconciliation (displayed == enforced, FIXED fails closed, refusals classified)
        run: python3 tools/test_at_risk_audit.py 2>&1 | tee out/test_at_risk_audit.log

      - name: EdgeBook persistence contract
        run: python3 tools/test_edgebook_contract.py 2>&1 | tee out/test_edgebook.log

      - name: One causal zone role (BUY/SELL direction contract)
        run: python3 tools/test_zre_signal_role.py 2>&1 | tee out/test_zre_signal_role.log

      - name: Order block lifecycle (one age rule, two state machines, no buffer moved)
        run: python3 tools/test_orderblock_lifecycle.py 2>&1 | tee out/test_orderblock_lifecycle.log

      # Phase 2 (AUDIT-SB1). Two display-only modules were added to a file whose
      # Core buffers an Expert Advisor reads by index, so the contracts that
      # matter are the negative ones: no buffer moved, no existing default
      # changed, and no execution-adjacent function can read the new state.
      - name: Power of 3 + Silver Bullet (display only, no buffer moved, cannot authorize)
        run: python3 tools/test_phase2_modules.py 2>&1 | tee out/test_phase2_modules.log

      # Phase 3 (AUDIT-WY1). The risk here is not the new logic, it is a THIRD
      # opinion about the same bar: DetectJudasSwing already sweeps the Asia range
      # and DetectLiquidity already clusters equal highs/lows. These contracts
      # check the module reconciles with Judas instead of contradicting it, reuses
      # the existing sweep validator rather than inventing a looser one, and cannot
      # let the bar under test widen the range it pierces.
      - name: Wyckoff Spring/Upthrust (reconciled with Judas, no buffer moved, display only)
        run: python3 tools/test_phase3_wyckoff.py 2>&1 | tee out/test_phase3_wyckoff.log

      # AUDIT-PA1 pure price action. Proves the module reuses AnalyzeClosedCandle()
      # instead of re-implementing it, that INSIDE_BAR is reported only where the
      # existing chain found nothing (so no bar is reclassified), that a pattern
      # outside every zone resolves to no direction and a score of 0, and that the
      # single edit to existing code - the ContextualCandleScore() zone gate - is
      # inert while InpPARequireZoneContext is false. It also PINS the pre-existing
      # three-way candle divergence by searching for bars on which
      # AnalyzeClosedCandle(), AnalyzeCandleIntelligence() and the MTF sniper C1
      # gate disagree, so that divergence cannot be silently "fixed" by tightening
      # an entry gate.
      - name: Pure price action (never standalone, no buffer moved, display only)
        run: python3 tools/test_phase4_priceaction.py 2>&1 | tee out/test_phase4_priceaction.log

      # AUDIT-CF1 Phase 6: the Confluence Engine. Proves the six weights sum to
      # exactly 100, that absent evidence scores 0 rather than a free point, that
      # a side is named only when EXACTLY ONE side clears the minimum, and that the
      # engine is a separate score BESIDE the existing ones - pinned by the exact
      # call-count delta it introduced and by unchanged g_score./final_score counts.
      - name: Confluence engine (six pillars, weights sum to 100, never forces a direction)
        run: python3 tools/test_phase6_confluence.py 2>&1 | tee out/test_phase6_confluence.log

      # AUDIT-RM1 Phase 7: the risk model. Proves the sizing output is TEXT ONLY
      # (no trade API, no buffer, no drawing), that the divisor from
      # TheoreticalRiskMoney() is refused before it is divided by, that the module
      # reuses the existing risk helpers and inputs instead of building a second
      # risk model, and that it never invents a direction the confluence engine
      # refused to name.
      - name: Risk model (advisory text only, no order, reuses the existing risk inputs)
        run: python3 tools/test_phase7_riskmodel.py 2>&1 | tee out/test_phase7_riskmodel.log

      # AUDIT-A2 (unreleased, display-only). Proves the five playbook predicates
      # stand aside without complete evidence, that the OTE zone they read is the
      # file's own GetOTEZone(), that the rows reach ONLY the dashboard tooltip
      # behind both switches, and that the module cannot authorize anything: no
      # buffer, no trade API, no alert, one call per closed bar.
      - name: ICT Pullback Playbook (display only, no buffer moved, cannot authorize)
        run: python3 tools/test_phase8_ictplaybook.py 2>&1 | tee out/test_phase8_ictplaybook.log

      - name: Scenario geometry (self-test numbers must still describe zones)
        run: python3 tools/check_scenario_geometry.py 2>&1 | tee out/geometry.log

      - name: Host patch must stay idempotent (marker in nadir2.mq5)
        run: python3 tools/apply_qsmc_arb_patch.py --check 2>&1 | tee out/patch_check.log

      # v6.6.22 (AUDIT-CH1 / AUDIT-SVP). Both suites EXECUTE MQL5 text built by the
      # runner's g++ against a simulator of the terminal - still not MetaEditor.
      # The first runs the real AlertDispatcherDrawPrimary() of nadir2.mq5 before
      # and after the fix (N marks per setup -> one). The second builds the SMC +
      # Volume Profile engine and its modules, runs every unit, replays a series
      # and its mirror image through OnInit/OnCalculate/OnDeinit, and repeats the
      # run with poisoned array growth and under ASan + UBSan.
      - name: Chart hygiene (one mark per setup, layer policy) - executed
        run: python3 tools/test_qsmc_chart_hygiene.py 2>&1 | tee out/qsmc_chart_hygiene.log

      - name: SMC + Volume Profile engine (units, mirrored replay, sanitizers) - executed
        run: python3 tools/test_qsmc_smcvp.py 2>&1 | tee out/qsmc_smcvp.log

      # Separate from the static checks on purpose: they protect the code, this
      # one protects the deployment (single version, complete layout, documented
      # inputs, no trade/network reach, no per-bar log flood).
      - name: release gate
        run: python3 tools/check_release_gate.py 2>&1 | tee out/release_gate.log

      # Over-optimisation defence (WFA-HARNESS / WFA-STATS). These two tools
      # decide whether a study is allowed to go forward, and both are pure
      # arithmetic plus file emission: no terminal, no history, no network. A
      # silent bug in them is worse than no gate at all, because it would print
      # GO with a straight face - so the arithmetic is pinned against
      # hand-computed values, and the emitted OOS .set is asserted to contain no
      # optimisation range (the single most expensive mistake in the workflow).
      - name: Walk-forward harness and robustness statistics
        run: python3 tools/test_wfa_robustness.py 2>&1 | tee out/wfa_robustness.log

      # The most common support question is "the EA is attached and it opens no
      # trades". tools/why_no_trades.py answers it from the Experts tab, and a
      # wrong answer there can tell an operator to reset a drawdown breaker. So
      # the classification is pinned against real-shaped journal lines plus the
      # 2026-11-09 session fixture.
      - name: Why-no-trades classification
        run: python3 tools/test_why_no_trades.py 2>&1 | tee out/why_no_trades.log

      # ---------------------------------------------------------------------
      # Every remaining offline suite, wired on 2026-11-27.
      #
      # 22 suites in tools/ were green but unrun by CI: 66 of 88 were invoked by
      # a real `python3 tools/...` line and these were not, so a regression in
      # any of them was invisible until someone ran it by hand. All 22 run here
      # in 22.4 seconds combined on this host, so none of them is excluded for
      # being slow. Nothing in this block is environment-bound either - the five
      # that need a host compiler follow the same exit-77 skip contract as the
      # five native suites already wired above, and ubuntu-latest has g++.
      #
      # Deliberately NOT added, with the reason in each case:
      #   * the eight suites in the `pin-drift` job below stay report-only. They
      #     pass locally now that tools/pinmap.json re-anchors them, but moving
      #     them into this job turns eight report-only steps into blocking
      #     gates, which is a policy change and not a wiring fix.
      #   * tools/qats_sim/ and tools/smcvp_sim/ are harnesses, not suites.
      # ---------------------------------------------------------------------

      # The four source contracts added in this repair round: the 27-buffer map
      # against the #defines, the seven relaxed thresholds against their read
      # sites, the generated 934-input reference, and the frozen incident
      # evidence folder against the README that explains which subtree to read.
      - name: Buffer contract (27 buffers, doc <-> #define agreement)
        run: python3 tools/test_buffer_contract.py 2>&1 | tee out/test_buffer_contract.log

      - name: Seven relaxed thresholds (declared default, read sites, kill switch)
        run: python3 tools/test_seven_thresholds.py 2>&1 | tee out/test_seven_thresholds.log

      - name: Generated input reference (934 inputs, meanings are source comments)
        run: python3 tools/test_inputs_reference.py 2>&1 | tee out/test_inputs_reference.log

      - name: Frozen incident evidence map (which subtree is authoritative)
        run: python3 tools/test_incident_evidence_map.py 2>&1 | tee out/test_incident_evidence_map.log

      # Two include-graph gates. The graph is 12 programs / 34 headers / 78
      # resolvable edges and acyclic; a cycle or a header included without its
      # guard is a compile failure that no offline source check would catch.
      - name: Include graph (fan-in, cycles, orphans)
        run: python3 tools/check_include_graph.py 2>&1 | tee out/check_include_graph.log

      - name: Include-graph gate (comment trap, cycles, guards, coupling)
        run: python3 tools/test_include_graph.py 2>&1 | tee out/test_include_graph.log

      # Compile-error classes that were real MetaEditor failures before: a lost
      # '//', a comma-separated input declaration, a shadowed global. This is a
      # pattern gate over the text - it is NOT a compile and does not prove the
      # file builds. F7 is still the only proof of that.
      - name: Compile-error classes (lost comment, comma declarators, shadows)
        run: python3 tools/test_compile_errors.py 2>&1 | tee out/test_compile_errors.log

      - name: Causal chain regressions (order of operations in the signal path)
        run: python3 tools/test_causal_chain_regressions.py 2>&1 | tee out/test_causal_chain_regressions.log

      # Display authority: three suites that keep the chart from saying
      # something the signal path did not decide - which is the exact failure
      # mode the 2026-11-01 incident was about.
      - name: Display authority (non-Core vocabulary cannot authorize)
        run: python3 tools/test_display_authority.py 2>&1 | tee out/test_display_authority.log

      # The v6.5.0 reaction layer promises "CLASSIFICATION ONLY" at nadir2.mq5:40185.
      # This is the suite that holds it to that: no trading API in any of the 86
      # RXN_* definitions, no signal buffer written or named, no write to the
      # authoritative signal state, and an exhaustive pinned list of the seven
      # non-RXN functions allowed to read g_rxn_* at all - so a new reader fails
      # even if it looks harmless.
      - name: RXN classification-only contract (no trading function of any kind)
        run: python3 tools/test_rxn_classification_only.py 2>&1 | tee out/test_rxn_classification_only.log

      - name: Incident compact badge (measurement, panel avoidance, ownership)
        run: python3 tools/test_incident_compact.py 2>&1 | tee out/test_incident_compact.log

      - name: Scanner snapshot rendered before reset
        run: python3 tools/test_scanner_snapshot.py 2>&1 | tee out/test_scanner_snapshot.log

      # Provenance: a number on the chart must be attributable to a quote or to
      # a closed bar. Both suites EXECUTE the real MQL5 bodies with g++ when a
      # compiler is present and skip visibly when one is not.
      - name: Price provenance (Bid/Ask vs CLOSED[1] separation)
        run: python3 tools/test_price_provenance.py 2>&1 | tee out/test_price_provenance.log

      - name: Zone provenance (symbol-history plausibility gate) - executed
        run: python3 tools/test_zone_provenance.py 2>&1 | tee out/test_zone_provenance.log

      - name: Volatility window (causal percentiles, no look-ahead) - executed
        run: python3 tools/test_volatility_window.py 2>&1 | tee out/test_volatility_window.log

      - name: EL data integrity (copy gate bodies) - executed
        run: python3 tools/test_el_data_integrity.py 2>&1 | tee out/test_el_data_integrity.log

      - name: EL Sniper readiness (zone detection bodies) - executed
        run: python3 tools/test_el_sniper_readiness.py 2>&1 | tee out/test_el_sniper_readiness.log

      - name: Opportunity funnel (the "no trades" explanation) - executed
        run: python3 tools/test_opportunity_funnel.py 2>&1 | tee out/test_opportunity_funnel.log

      # The comma-separated-declarator parser that caused 32 MetaEditor errors,
      # plus the input-manifest identity it feeds. The second one shells out to
      # tools/generate_input_fingerprint.py --check, so it also pins the
      # generated header to its generator.
      - name: Input fingerprint parser (comma declarators, native checksum) - executed
        run: python3 tools/test_input_fingerprint_parser.py 2>&1 | tee out/test_input_fingerprint_parser.log

      - name: Instance identity (per-config diagnostics, default binding)
        run: python3 tools/test_instance_identity.py 2>&1 | tee out/test_instance_identity.log

      # The curated gate over the whole native estate: it asserts that every
      # native suite either runs for real or exits 77 with its source checks
      # still reported, and never passes silently. Wiring it means a suite that
      # quietly stops compiling is caught even on a host with no compiler.
      - name: Native toolchain contract (a skip is visible, never a pass)
        run: python3 tools/test_native_toolchain.py 2>&1 | tee out/test_native_toolchain.log

      - name: Scalper preset (the shipped .set matches the documented behaviour)
        run: python3 tools/test_scalper_preset.py 2>&1 | tee out/test_scalper_preset.log

      - name: Signal execution profiles (source + reference parity)
        run: python3 tools/test_signal_execution_profiles.py 2>&1 | tee out/test_signal_execution_profiles.log

      # ---------------------------------------------------------------------
      # Pinned audit contracts, promoted from the report-only `pin-drift` job
      # on 2026-11-27.
      #
      # These seven were demoted to report-only on 2026-11-06 because they were
      # red on `main` for several merges: each asserts against a snapshot of
      # nadir2.mq5 that had moved - literal line numbers, a literal brace count,
      # a literal enum count, a literal total line count. The code they describe
      # was intact; the pins were coordinates in a file that had since been
      # re-typeset. Keeping them blocking was not making the build safer, it was
      # making the whole signal red, which is how a real regression gets ignored.
      #
      # tools/pinmap.py was the fix: it translates a pinned line number through a
      # committed crosswalk (tools/pinmap.json) and the suite then asserts on the
      # CONTENT it lands on, so a moved line is followed and a changed line still
      # fails. The crosswalk is now consistent - `pinmap.py --check` reports 292
      # pins, 0 unresolvable, and its stats block is itself gated - and every one
      # of these suites passes on this tree. The demotion's own exit condition
      # ("when a suite here goes green, move its step back up") has been met, so
      # they are gates again.
      #
      # The eighth step of the old job, test_gate_profile.py, is NOT re-added: it
      # has been running as a blocking step in this job all along, so the
      # report-only copy was a duplicate that could only ever disagree with it.
      #
      # If one of these goes red again after an edit to nadir2.mq5, the right
      # response is to re-anchor the pin with tools/pinmap.py --build (which
      # needs git history) and check the suite still asserts what it meant - not
      # to weaken the assertion and not to demote the step again.
      # ---------------------------------------------------------------------
      - name: The pin crosswalk must be consistent before the pinned suites run
        run: python3 tools/pinmap.py --check 2>&1 | tee out/pinmap_check.log

      - name: Final-signal resolver contract (AUDIT-RS1)
        run: python3 tools/test_resolver.py 2>&1 | tee out/resolver.log

      - name: Weighted evidence gates contract (AUDIT-GS1)
        run: python3 tools/test_weighted_gates.py 2>&1 | tee out/weighted_gates.log

      - name: Scalping overlay contract (AUDIT-SC1)
        run: python3 tools/test_scalping.py 2>&1 | tee out/scalping.log

      - name: Decision journal contract (AUDIT-OBS1)
        run: python3 tools/test_decision_journal.py 2>&1 | tee out/decision_journal.log

      - name: Declutter cap contract (AUDIT-D1)
        run: python3 tools/test_declutter_cap.py 2>&1 | tee out/declutter_cap.log

      - name: Mean reversion / momentum (confirmed swings only, MACD veto-only, display only)
        run: python3 tools/test_phase5_meanreversion.py 2>&1 | tee out/phase5_meanreversion.log

      - name: No stale copy of a header may be committed
        run: |
          dup=$(git ls-files 'MQL5/**' | while read -r f; do basename "$f"; done | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "duplicated file names in two places (one build silently wins): $dup" >&2
            exit 1
          fi

      - name: Manual gate
        run: |
          echo "NOT COMPILED HERE. Open nadir2.mq5 in MetaEditor and press F7."
          echo "The init log must read:"
          version="$(sed -n 's/^#define QSMC_VERSION_TEXT "\(v[0-9.]*\)".*/\1/p' nadir2.mq5 | head -1)"
          echo "  [QSMC_ARB] ${version} arbitration layer ON | preset INTRADAY (M15-H1) | gates 10 ..."
          echo "Any other version in that line means a stale copy is in the Data Folder."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-gates
          path: out/
          if-no-files-found: ignore
