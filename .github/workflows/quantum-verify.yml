name: QATS structural verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: verify QuantumAutonomousTradingSystem (offline, NOT a compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural verification of the EA source
        run: python3 tools/verify_quantum_ea.py
      - name: MetaEditor error regression checks (not a compile)
        run: python3 tools/test_quantum_compile_regressions.py
      - name: XAUUSD execution and account authorization harnesses (offline)
        run: |
          python3 tools/test_xau_execution_policy.py
          python3 tools/test_quantum_account_policy.py
      # v1.20. The three steps below compile the WHOLE .mq5 with the host g++ against
      # a typed MQL5 API shim and run the real source in a broker simulator. A skip
      # (exit 77: no compiler) is a failure HERE: CI exists to verify what a desktop
      # without g++ cannot.
      - name: Whole-file strict host build (zero errors, zero warnings, 14 injected defects rejected)
        run: python3 tools/test_qats_native_build.py
      - name: Dual-direction engine (unit, 51 scenarios, mirrored twins, symmetry replay, sanitizers)
        run: python3 tools/test_qats_dual_direction.py
      - name: Journal report (the DEMO forward-test evidence format)
        run: python3 tools/test_qats_journal_report.py
      - name: LIMIT-entry contracts (v1.21+, F7-fixed in v1.22) (no weakened guard, cap counts fills only)
        run: python3 tools/test_qats_limit_entry.py
      - name: Manual gate still required
        run: |
          echo "This job is NOT a MetaEditor compile and NOT an MT5 demo test."
          echo "A host-compiler build of the transpiled source is evidence, not proof, of a clean F7."
          echo "F7 in MetaEditor remains the build gate; a DEMO chart attachment"
          echo "remains the execution gate. See docs/QATS_DUAL_DIRECTION_AUDIT_2026-11-11.md"
